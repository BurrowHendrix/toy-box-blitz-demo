<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Toy Box Blitz — Player Demo</title>
<style>
  html, body { margin:0; height:100%; background:#05080a; overflow:hidden; font-family: Impact, Haettenschweiler, "Arial Black", sans-serif; }
  #c { display:block; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; color:#fff; }
  #score {
    position:absolute; top:14px; left:14px;
    background:linear-gradient(180deg,#1a1a1a,#000);
    border:2px solid #c9a227; border-radius:20px;
    padding:8px 16px; display:flex; gap:18px; align-items:center;
    box-shadow:0 4px 12px rgba(0,0,0,.5); font-size:18px; letter-spacing:1px;
  }
  #score .team { color:#7fdfff; }
  #score .team.away { color:#ffb07a; }
  #score .sep { color:#888; }
  #banner {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background:linear-gradient(180deg,#2a2a2a,#111);
    border:2px solid #ddd; border-radius:4px 4px 10px 10px;
    padding:6px 28px; font-size:20px; letter-spacing:2px;
    box-shadow:0 6px 16px rgba(0,0,0,.45);
  }
  #turboWrap {
    position:absolute; left:14px; bottom:18px; width:180px;
  }
  #turboLabel { font-size:14px; color:#6cf; letter-spacing:2px; margin-bottom:2px; }
  #turboBar {
    height:14px; background:#123; border:2px solid #2af; border-radius:3px; overflow:hidden;
  }
  #turboFill { height:100%; width:100%; background:linear-gradient(90deg,#0af,#6ff); transition:width .05s linear; }
  #help {
    position:absolute; right:14px; bottom:14px; font-family: system-ui, sans-serif;
    font-size:12px; color:#cde; background:rgba(0,0,0,.45); padding:8px 12px; border-radius:8px;
    line-height:1.45;
  }
  #td {
    position:absolute; left:50%; top:42%; transform:translate(-50%,-50%) scale(.6);
    font-size:72px; color:#ffd200; text-shadow:0 0 20px #f80, 4px 4px 0 #000, -2px -2px 0 #000;
    letter-spacing:6px; opacity:0; pointer-events:none;
    transition: opacity .15s, transform .15s;
  }
  #td.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #title {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:auto;
  }
  #title h1 {
    font-size:56px; margin:0; color:#7fdfff;
    text-shadow:0 0 24px #0af, 3px 3px 0 #000; letter-spacing:4px;
  }
  #title p { font-family:system-ui,sans-serif; color:#ddd; margin:12px 0 20px; }
  #title button {
    pointer-events:auto; cursor:pointer;
    font-family:Impact,sans-serif; font-size:28px; letter-spacing:3px;
    padding:12px 36px; background:#0af; color:#001; border:3px solid #fff; border-radius:8px;
  }
  #title button:hover { background:#6ff; }
  #fps { position:absolute; top:14px; right:14px; font-family:monospace; font-size:12px; color:#8f8; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="score">
    <span class="team">TBB <b id="scoreHome">0</b></span>
    <span class="sep">Q1 15:00</span>
    <span class="team away">OPP <b id="scoreAway">0</b></span>
  </div>
  <div id="banner">1st &amp; 10</div>
  <div id="turboWrap">
    <div id="turboLabel">TURBO</div>
    <div id="turboBar"><div id="turboFill"></div></div>
  </div>
  <div id="help">
    <b>WASD / Arrows</b> move · <b>Shift / Space</b> turbo<br/>
    <b>E</b> juke · <b>Q</b> spin · <b>F</b> stiff-arm · <b>R</b> hurdle<br/>reach the far BLITZ end zone
  </div>
  <div id="td">TOUCHDOWN!</div>
  <div id="fps"></div>
  <div id="title">
    <h1>TOY BOX BLITZ</h1>
    <p>Player control demo · arcade cam · #8</p>
    <button id="startBtn" type="button">PLAY</button>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js?v=eba0a7b"></script>
</body>
</html>
